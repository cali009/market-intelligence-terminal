name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    # Run every weekday at 16:30 EST (21:30 UTC) after US & Canadian markets close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Needed so the forward-paper step can commit its own log back to the branch.
    permissions:
      contents: write
    # The pipeline has been measured at ~23 minutes at 163 symbols. Without a timeout a
    # job runs to the 360-minute default, which turns a hang into a six-hour bill.
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history, so the forward-log commit can push without a shallow-repo error.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Master Market Intelligence Pipeline
        run: |
          python3 scripts/run_daily_pipeline.py

      - name: Build Public Distribution Bundle
        run: |
          python3 scripts/build_firebase_public.py

      - name: Extract Firebase Project ID
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPLICIT_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          python3 -c "
          import json, os
          explicit = os.environ.get('EXPLICIT_PROJECT_ID', '').strip()
          sa_raw = os.environ.get('SERVICE_ACCOUNT', '').strip()
          proj_id = explicit
          if not proj_id and sa_raw:
              try:
                  data = json.loads(sa_raw)
                  proj_id = data.get('project_id', '')
              except Exception as e:
                  print('Could not parse SERVICE_ACCOUNT JSON:', e)
          if proj_id:
              print(f'Detected Firebase Project ID: {proj_id}')
              with open('.firebaserc', 'w') as f:
                  json.dump({'projects': {'default': proj_id}}, f, indent=2)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'DETECTED_PROJECT_ID={proj_id}\n')
          else:
              print('No valid project ID found in secrets or credentials.')
          "

      - name: Deploy via Service Account (if configured)
        if: env.SERVICE_ACCOUNT != '' && env.DETECTED_PROJECT_ID != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ env.DETECTED_PROJECT_ID }}'

      - name: Deploy via Firebase Token (if configured)
        if: env.FIREBASE_TOKEN != '' && env.SERVICE_ACCOUNT == ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Commit Forward Paper Log
        # ONLY the append-only forward log is committed. The database is 84 MB and is
        # regenerated every run; committing it would grow the repository without bound and
        # GitHub rejects files above 100 MB. Nothing else here needs to persist.
        #
        # This step is what makes gate 8 achievable at all. Without it the log is written
        # inside an ephemeral runner and thrown away, so the three months of forward record
        # the gate requires could never accumulate.
        run: |
          if [ ! -f data/forward_paper_log.jsonl ]; then
            echo "No forward paper log produced; nothing to commit."
            exit 0
          fi
          git config user.name "market-intel-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add data/forward_paper_log.jsonl
          if git diff --cached --quiet; then
            echo "Forward log unchanged."
            exit 0
          fi
          # Refuse to shrink the log. A shorter file means records were removed, which is
          # exactly the tampering the hash chain exists to expose.
          REMOTE_LINES=$(git show origin/${GITHUB_REF_NAME}:data/forward_paper_log.jsonl 2>/dev/null | wc -l || echo 0)
          LOCAL_LINES=$(wc -l < data/forward_paper_log.jsonl)
          if [ "$LOCAL_LINES" -lt "$REMOTE_LINES" ]; then
            echo "::error::Forward log shrank from $REMOTE_LINES to $LOCAL_LINES lines. Refusing to commit."
            exit 1
          fi
          git commit -m "Forward paper log: $(date -u +%Y-%m-%dT%H:%MZ) ($LOCAL_LINES records)"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Build Summary
        run: |
          echo "=========================================================="
          echo " Pipeline Execution Complete!"
          echo " Target Firebase Project: ${DETECTED_PROJECT_ID:-Not configured}"
          echo " Total staged files: $(find public -type f | wc -l)"
          echo "=========================================================="
