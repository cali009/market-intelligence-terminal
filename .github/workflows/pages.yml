name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run every weekday at 16:30 EST (21:30 UTC) after US & Canadian markets close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Numerical Packages
        run: |
          pip install -r requirements.txt

      - name: Run Master Market Intelligence Pipeline
        run: |
          python3 scripts/run_daily_pipeline.py

      - name: Build Static Distribution Bundle
        run: |
          python3 scripts/build_firebase_public.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
